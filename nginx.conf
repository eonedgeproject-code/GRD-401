# GRD-401 Nginx Configuration
# Place in /etc/nginx/sites-available/grd-401
# Symlink: ln -s /etc/nginx/sites-available/grd-401 /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name grd-401.com www.grd-401.com;  # Change to your domain

    # Redirect HTTP → HTTPS (uncomment after SSL setup)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3401;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;  # WebSocket keep-alive
    }

    # WebSocket endpoint
    location /ws {
        proxy_pass http://127.0.0.1:3401/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # API rate limiting
    # limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # location /api/ {
    #     limit_req zone=api burst=50 nodelay;
    #     proxy_pass http://127.0.0.1:3401;
    # }
}

